services:
  - type: web
    name: hiredek-eye-care
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --prefix backend && npm install --include=dev --prefix frontend && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
